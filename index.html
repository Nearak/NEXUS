<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS: الجدار المكسور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- شاشة البداية -->
        <div id="boot-screen">
            <div class="boot-container">
                <div class="boot-logo">█ NEXUS</div>
                <div class="boot-sub">The Broken Wall</div>
                <div class="boot-progress"><div id="bootBar"></div></div>
                <button id="bootBtn" style="display:none;" onclick="startGame()">دخول إلى المحطة</button>
            </div>
        </div>

        <!-- شاشة اللعبة -->
        <div id="game" style="display:none;">
            <!-- HUD -->
            <div id="hud">
                <div class="hud-item"><i class="fas fa-user"></i> <span id="hud-level">1</span></div>
                <div class="hud-item"><i class="fas fa-coins"></i> <span id="hud-money">1000</span>$</div>
                <div class="hud-item"><i class="fas fa-microchip"></i> <span id="hud-cpu">0</span>%</div>
                <div class="hud-item"><i class="fas fa-exclamation-triangle"></i> <span id="hud-wanted">0</span>/5</div>
            </div>

            <!-- منطقة الإشعارات -->
            <div id="notifications"></div>

            <!-- المحطة الطرفية -->
            <div id="terminal-wrapper">
                <div id="terminal-output"></div>
                <div id="terminal-input-line">
                    <span class="prompt">$</span>
                    <input type="text" id="terminal-input" placeholder="اكتب أمراً..." autofocus>
                </div>
                <div id="quick-commands">
                    <button onclick="quickCmd('help')">help</button>
                    <button onclick="quickCmd('ls')">ls</button>
                    <button onclick="quickCmd('scan')">scan</button>
                    <button onclick="quickCmd('crack NEXUS_CORP')">crack</button>
                    <button onclick="quickCmd('tasks')">tasks</button>
                    <button onclick="quickCmd('clear')">clear</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
